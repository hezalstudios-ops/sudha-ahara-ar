<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudha Ahara AR Menu</title>

  <!-- A-Frame + AR.js (WebXR) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="hint">Tap on any surface to place menu</div>

<a-scene
  embedded
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Lighting -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="0 5 5" intensity="0.6"></a-light>

  <!-- Camera -->
  <a-camera></a-camera>

  <!-- Reticle (shows where it will place) -->
  <a-entity
    id="reticle"
    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
    material="color: white; shader: flat"
    rotation="-90 0 0"
    visible="false">
  </a-entity>

  <!-- Menu -->
  <a-plane
    id="menu"
    src="Final_MainMenu_SudhaAhara.jpg"
    width="0.7"
    height="1"
    visible="false"
    material="transparent: true"
    shadow>
  </a-plane>

</a-scene>

<script>
  const scene = document.querySelector('a-scene');
  const reticle = document.querySelector('#reticle');
  const menu = document.querySelector('#menu');
  let placed = false;

  scene.addEventListener('click', () => {
    if (reticle.object3D.visible && !placed) {
      menu.setAttribute('position', reticle.getAttribute('position'));
      menu.setAttribute('rotation', '-90 0 0');
      menu.setAttribute('visible', true);
      placed = true;
      document.getElementById('hint').style.display = 'none';
    }
  });

  scene.addEventListener('loaded', () => {
    scene.systems['arjs'].el.sceneEl.addEventListener('hit-test', e => {
      if (!placed) {
        reticle.setAttribute('position', e.detail.position);
        reticle.object3D.visible = true;
      }
    });
  });
</script>

</body>
</html>
